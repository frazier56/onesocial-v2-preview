<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OneJob — Get hired. Get paid.</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<link rel="canonical" href="https://www.oneworldlabs.ai/onejob/" />
<meta name="robots" content="noindex" />
<script>
/* LEGACY PATH REDIRECTOR — /onesocial-v2-preview/* -> /onejob/*
   OneJob's canonical home is www.oneworldlabs.ai/onejob (Jul 25 2026). This path is kept alive
   ONLY so previously-shared links and printed QR codes keep working. It must never serve a second
   copy of the app: two builds on two paths silently drift, and Lee hit exactly that — the old path
   was four builds behind and still showing the pre-restyle contract form.
   Preserves the sub-path, the query string AND the hash (Supabase returns OAuth tokens in the
   hash, so dropping it would break Google sign-in on any old bookmark). */
(function () {
  var p = location.pathname.replace(/^\/onesocial-v2-preview\/?/, "");
  location.replace("/onejob/" + p + (location.search || "") + (location.hash || ""));
})();
</script>
</head>

</body>
</html>
